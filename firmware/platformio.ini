; ===========================================================================
; PlatformIO 工程配置
;
;   [env:h750]   目标固件：STM32H750ZBT6（480MHz，128KB Flash，需外部 QSPI 存字库）
;   [env:native] 主机单元测试：与 Makefile 使用相同的源码与 H750_PC_SIM 后端
; ===========================================================================

[platformio]
default_envs = h750
src_dir = .
include_dir = include

[env]
build_flags =
    -Iinclude
    -Ihal
    -std=c99
    -Wall
    -Wextra

[env:h750]
platform = ststm32
board = genericSTM32H750VB
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags =
    ${env.build_flags}
    -DH750_TARGET_BUILD=1
    -mcpu=cortex-m7
    -mthumb
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    -O2
    -ffunction-sections
    -fdata-sections
build_src_filter =
    +<src/>
    +<hal/>
    -<test/>
    -<build/>
board_build.ldscript = linker/stm32h750zbtx.ld

; 主机单元测试环境：需在目标机上安装本地编译器（Linux/macOS 自带 gcc）
[env:native]
platform = native
test_build_src = yes
build_flags =
    ${env.build_flags}
    -Itest
    -DH750_PC_SIM=1
    -O1
    -g
build_src_filter =
    +<src/>
    +<hal/>
    +<test/>
test_framework = custom
